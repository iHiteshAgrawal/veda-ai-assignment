name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Read from .nvmrc so CI and local development can't drift. They did:
          # npm 11 (Node 25) prunes cross-platform optional deps that npm 10
          # (Node 22) keeps, producing a lock file that `npm ci` rejects on Linux.
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      # Build last: it's the slowest step, so failing lint/types/tests first
      # gives quicker feedback. No API keys needed — every provider call is
      # behind a route, and nothing runs at build time.
      - run: npm run build
